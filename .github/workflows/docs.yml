name: Docs

# Build on every push so a broken docs build is caught on the PR branch.
# Deploy to GitHub Pages only from main.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e . --quiet
          pip install mkdocs mkdocs-material mkdocstrings mkdocstrings-python --quiet

      - name: Generate example READMEs
        run: python3 tools/generate_example_readmes.py --build

      - name: Build site
        run: mkdocs build --clean

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
